name: org-isolation

# The gate the security statement says we did not have. Runs the cross-org
# isolation suite against a throwaway copy-on-write Neon branch, with the code
# under test connected as smr_app -- the role that CANNOT bypass row-level
# security. A suite that runs as the table owner passes whatever the policies
# say, which is how "13/13" was once weaker evidence than it looked.
#
# EVERY PULL REQUEST, NO PATH FILTER (2026-10-02). The PR run is the half that
# makes this a gate. On push-to-main only, Vercel was already deploying the
# commit while this was still creating its branch: it could report a broken
# boundary, never stop one. Authorization work goes through a PR and merges
# when this is green. The PR trigger used to be path-filtered to save
# Neon compute, but the org boundary is reached from more places than any list
# keeps up with (a page, a lib helper, a new route), so a filtered gate could
# skip exactly the change that breaks it. Cost: one throwaway Neon branch per
# PR run. Fork PRs get no secrets, so this job fails there rather than passing
# unchecked.
#
# The post-merge push run stays path-filtered: by then the PR run has passed.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "packages/core/src/**"
      - "packages/core/migrations/**"
      - "apps/consumer/auth.ts"
      - "apps/consumer/lib/org-*.ts"
      - "apps/consumer/lib/effective-auth.ts"
      - "apps/consumer/app/api/org/**"
      - "apps/consumer/app/api/partner/**"
      - "apps/consumer/app/api/admin/**"
      - "apps/consumer/app/api/dev/**"
      - "apps/consumer/app/api/user/**"
      - "apps/consumer/app/api/consent/**"
      - "apps/consumer/app/api/hub-unlock/**"
      - "apps/consumer/app/api/assistant/**"
      - "scripts/verify-org-isolation.mjs"
      - "scripts/verify-directory.mjs"
      - "scripts/verify-directory-grants.mjs"
      - "scripts/rls-stage1-create-role.mjs"
      - "scripts/lib/**"
      - "scripts/neon-branch.mjs"
      - ".github/workflows/org-isolation.yml"
  workflow_dispatch:

concurrency:
  group: org-isolation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      BRANCH: ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w packages/core

      - name: Create throwaway branch (refuses the production endpoint)
        run: node scripts/neon-branch.mjs create "$BRANCH"

      # New migrations in this push are applied to the branch first, so a policy
      # change is tested before it reaches production rather than after. The
      # connection string is read from the file inside node and never echoed.
      - name: Apply migrations to the branch
        run: |
          node -e '
            const fs = require("fs"), cp = require("child_process");
            const line = fs.readFileSync(".env.isolation","utf8").split("\n").find(l => l.startsWith("ISOLATION_TEST_DATABASE_URL="));
            const url = line.slice(line.indexOf("=")+1).trim().replace(/^["\x27]|["\x27]$/g,"");
            const r = cp.spawnSync("npm", ["run","migrate","-w","packages/core"], { stdio: "inherit", env: { ...process.env, DATABASE_URL: url } });
            process.exit(r.status ?? 1);
          '

      # Before rls-stage1 repairs grants, so a migration's own grant defects show.
      - name: Directory grants as the migration left them
        run: node scripts/verify-directory-grants.mjs

      - name: Create the restricted app role on the branch
        run: node scripts/rls-stage1-create-role.mjs

      - name: Cross-org isolation suite
        run: npm run verify:isolation

      - name: Employer directory rules (061)
        run: npm run verify:directory

      - name: Delete the branch
        if: always()
        run: node scripts/neon-branch.mjs delete "$BRANCH" || true
