name: ci

on:
  push:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # No database needed, so it runs on every push: an unscoped query against a
      # row-level-protected table returns nothing instead of failing.
      - run: node scripts/lint-protected-tables.mjs
      # The repo is public: fail on credential-shaped lines in docs or a root HANDOFF.md.
      - run: node scripts/lint-no-secrets-in-docs.mjs
      - run: npm run build -w packages/core
      - run: npm run test -w packages/core
      - run: npm run typecheck -w apps/consumer
      # The consumer unit suite gates auth rate limits, org-output checking,
      # resume discrepancies and Forge-run ownership. It was written but never
      # run here, so `isSamePerson` -- added to stop a real cross-account data
      # bleed -- had no gate at all until 2026-09-23.
      - run: npm run test -w apps/consumer
      - run: npm run test:adversarial -w apps/consumer
      - run: npm run test:claims -w apps/consumer
