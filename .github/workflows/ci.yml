name: ci

on:
  push:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # No database needed, so it runs on every push: an unscoped query against a
      # row-level-protected table returns nothing instead of failing.
      - run: node scripts/lint-protected-tables.mjs
      - run: npm run build -w packages/core
      - run: npm run test -w packages/core
      - run: npm run typecheck -w apps/consumer
      - run: npm run test:adversarial -w apps/consumer
      - run: npm run test:claims -w apps/consumer
